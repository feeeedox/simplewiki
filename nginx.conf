server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    # Preserve the public host and port when running behind Docker or a proxy.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    location = / {
        return 302 /simplewiki/;
    }

    location /simplewiki/_nuxt/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri/index.html $uri $uri/ =404;
    }

    error_page 404 /simplewiki/404.html;
}
